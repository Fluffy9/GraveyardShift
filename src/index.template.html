<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#120e1a">
<title>Graveyard Shift — Demo</title>
<style>
  /* Pixel grid: one "px" unit = 1 native pixel of the UI. --hs is an INTEGER scale set by the game.
     --f (one 8-px font cell) is the base unit; all text, offsets and sizes are whole multiples of it,
     so the pixel font (one art pixel per grid unit) and the sprites stay on the grid. */
  :root { --hs: 2; --f: calc(8px * var(--hs)); --ink: #f7dbb0; --amber: #ffb85b; --lav: #b9a1e8; --pink: #f07f95; --char: #211a2d; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; height: 100dvh; background: #120e1a; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; overscroll-behavior: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  body { display: grid; place-items: center; font-family: 'GSPixel', monospace; text-transform: uppercase; color: var(--ink); font-size: var(--f); line-height: calc(var(--f) * 2); letter-spacing: 0; -webkit-font-smoothing: none; font-smooth: never; text-rendering: optimizeSpeed; font-synthesis: none; }
  #wrap { position: relative; }
  canvas#game { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
  .hud { position: absolute; inset: 0; pointer-events: none; text-shadow: var(--hs) var(--hs) 0 #120e1a; }
  .ingame { transition: opacity .3s steps(3); }
  body.menu .hud .ingame { opacity: 0; }
  .px-panel { position: absolute; padding: var(--f); background: transparent; }
  #tl { left: var(--f); top: var(--f); display: flex; align-items: center; gap: var(--f); padding: calc(var(--f) * .5) var(--f); }
  #tl .name { display: block; font-size: var(--f); margin-top: calc(var(--f) * .5); }
  #hearts { display: flex; gap: var(--hs); }
  #hearts.shake { animation: shake .4s steps(4); }
  #tr { right: var(--f); top: var(--f); text-align: right; }
  #clock { font-size: calc(var(--f) * 2); color: var(--ink); }
  #phase { font-size: var(--f); color: #c9a9d8; }
  /* score sits above the lantern bar so the two never share the same corner */
  #score { position: absolute; left: var(--f); bottom: calc(var(--f) * 5); font-size: calc(var(--f) * 2); color: var(--ink); }
  #combo { position: absolute; left: 50%; top: calc(var(--f) * 9); transform: translateX(-50%); font-size: calc(var(--f) * 2); color: var(--amber); opacity: 0; }
  #combo.show { opacity: 1; animation: pop .25s steps(3); }
  #bl { left: var(--f); bottom: var(--f); }
  #lanternbox { display: flex; align-items: center; gap: var(--f); }
  .bar { display: flex; align-items: center; height: calc(var(--f) * 1 - 0px); }
  .bar .spr-seg_on, .bar .spr-seg_off { margin-right: var(--hs); }
  #lanternbox.ready .spr-icon_lantern { animation: flick .9s steps(2) infinite; }
  .key { font-size: var(--f); color: #c9a9d8; }
  #lanternbox.ready .key { color: var(--amber); }
  #realm { right: var(--f); bottom: var(--f); display: flex; align-items: center; gap: var(--f); color: var(--amber); }
  #realm.spirit { color: var(--lav); }
  #realm .spr-tag_living, #realm .spr-tag_spirit { flex: none; }
  #note { position: absolute; left: 0; right: 0; margin: 0 auto; top: calc(var(--f) * 11); width: max-content; contain: paint; max-width: calc(100% - var(--f) * 4); text-align: center; font-size: var(--f); line-height: calc(var(--f) * 2); background: #f7dbb0; color: #3a2a3f; text-shadow: none; padding: var(--f) calc(var(--f) * 2); border: var(--hs) solid #b96d48; box-shadow: 0 0 0 var(--hs) #120e1a; opacity: 0; }
  #note.show { opacity: 1; }
  #note .tip-prompt { margin-top: var(--f); color: #8e3a3e; animation: blink 1.2s steps(1) infinite; }
  #note b { color: #8e3a3e; font-weight: normal; }
  kbd { font: inherit; padding: 0 var(--hs); border: var(--hs) solid currentColor; line-height: 1; }
  #overlay { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: var(--f); background: rgba(18,14,26,.82); pointer-events: none; }
  #overlay.show { display: flex; }
  #overlay.interactive { pointer-events: auto; }
  .menu-panel { width: min(100%, calc(var(--f) * 34)); max-height: calc(100% - var(--f) * 2); overflow: auto; text-align: left; background: #f7dbb0; color: #3a2a3f; text-shadow: none; padding: calc(var(--f) * 1.5); border: var(--hs) solid #b96d48; box-shadow: 0 0 0 var(--hs) #120e1a; }
  .menu-panel h2 { margin: 0 0 var(--f); text-align: center; color: #8e3a3e; text-shadow: none; }
  .menu-tabs { display: flex; gap: var(--hs); margin-bottom: var(--f); flex-wrap: wrap; }
  .menu-tab { flex: 1; min-width: calc(var(--f) * 8); font: inherit; text-transform: uppercase; color: #3a2a3f; background: #e8c79a; border: var(--hs) solid #b96d48; padding: calc(var(--hs) * 2) var(--f); cursor: pointer; }
  .menu-tab.on { background: #8e3a3e; color: #f7dbb0; border-color: #3a2a3f; }
  .menu-pane { min-height: calc(var(--f) * 14); margin-bottom: var(--f); }
  .menu-lead { margin: 0 0 var(--f); color: #8e3a3e; }
  .menu-list { margin: 0; padding-left: calc(var(--f) * 1.5); line-height: calc(var(--f) * 2); }
  .menu-list li { margin-bottom: var(--f); }
  .menu-controls { list-style: none; margin: 0; padding: 0; }
  .menu-controls li { display: grid; grid-template-columns: 1.1fr 1fr; gap: var(--f); align-items: baseline; margin-bottom: calc(var(--f) * .75); }
  .menu-key { color: #8e3a3e; }
  .menu-act { color: #3a2a3f; }
  .menu-setting { margin-bottom: var(--f); }
  .menu-setting label { display: block; margin-bottom: var(--hs); color: #8e3a3e; }
  .menu-slider { display: flex; align-items: center; gap: var(--f); }
  .menu-slider input[type="range"] { flex: 1; accent-color: #8e3a3e; height: var(--f); cursor: pointer; }
  .menu-vol { min-width: calc(var(--f) * 3); text-align: right; color: #3a2a3f; }
  .menu-mute { margin: 0; color: #6a4d5a; }
  .menu-actions { display: flex; gap: var(--f); justify-content: center; margin-bottom: var(--f); }
  .menu-btn { font: inherit; text-transform: uppercase; cursor: pointer; padding: calc(var(--hs) * 2) calc(var(--f) * 1.5); background: #8e3a3e; color: #f7dbb0; border: var(--hs) solid #3a2a3f; }
  .menu-btn.ghost { background: #e8c79a; color: #3a2a3f; border-color: #b96d48; }
  .menu-hint { margin: 0; text-align: center; color: #6a4d5a; }
  #overlay h1 { margin: 0 0 var(--f); font-size: calc(var(--f) * 2); line-height: calc(var(--f) * 2.5); font-weight: normal; color: var(--ink); text-shadow: calc(var(--hs)*2) calc(var(--hs)*2) 0 #8e3a3e, calc(var(--hs)*4) calc(var(--hs)*4) 0 #120e1a; }
  #overlay h2 { margin: 0 0 var(--f); font-size: calc(var(--f) * 2); font-weight: normal; color: var(--amber); text-shadow: var(--hs) var(--hs) 0 #120e1a; }
  #overlay h2.bad { color: var(--pink); }
  .flavor { color: #d9c2e6; margin: 0 0 var(--f); line-height: calc(var(--f) * 2); }
  .howto { font-size: var(--f); line-height: calc(var(--f) * 2); margin-bottom: var(--f); }
  .howto .sub { color: #c9a9d8; font-size: var(--f); line-height: calc(var(--f) * 2); margin-top: var(--hs); }
  .blink { color: var(--amber); animation: blink 1s steps(1) infinite; margin: 0 0 var(--f); }
  .tiny { font-size: var(--f); color: #8b7b8d; line-height: calc(var(--f) * 2); }
  .stats { display: grid; grid-template-columns: repeat(2, auto); gap: var(--f) calc(var(--f) * 3); margin-bottom: calc(var(--f) * 2); }
  .stats div { display: flex; flex-direction: column; gap: var(--hs); }
  .stats span { font-size: var(--f); color: #c9a9d8; }
  .stats b { font-size: calc(var(--f) * 2); font-weight: normal; }
  #pops { position: fixed; inset: 0; pointer-events: none; }
  .pop { position: absolute; transform: translate(-50%, -50%); font-size: var(--f); color: var(--ink); text-shadow: var(--hs) var(--hs) 0 #120e1a; animation: rise .9s steps(9) forwards; white-space: nowrap; }
  .pop.big { color: var(--amber); font-size: calc(var(--f) * 2); }
  .pop i { font-style: normal; color: var(--pink); }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--lav); font-size: var(--f); }
  body.ready #loading { display: none; }
  #stick { position: fixed; width: calc(var(--f) * 12); height: calc(var(--f) * 12); margin: calc(var(--f) * -6) 0 0 calc(var(--f) * -6); border-radius: 50%; border: var(--hs) solid rgba(247,219,176,.55); background: rgba(18,14,26,.25); display: none; pointer-events: none; }
  #stick::after { content: ''; position: absolute; left: 50%; top: 50%; width: calc(var(--f) * 4); height: calc(var(--f) * 4); margin: calc(var(--f) * -2); border-radius: 50%; background: rgba(255,184,91,.6); transform: translate(var(--dx, 0), var(--dy, 0)); }
  #stick.on { display: block; }
  /* touch / mobile */
  .tc { display: none; }
  body.touch .tc { display: inline; }
  body.touch div.tc { display: block; }
  body.touch .kb { display: none; }
  /* Mobile pause: top-right under the clock, away from the drag/stick zone. */
  #pausebtn {
    position: absolute; right: var(--f); top: calc(var(--f) * 7); left: auto; bottom: auto; transform: none;
    display: none; align-items: center; justify-content: center; gap: var(--hs);
    min-width: calc(var(--f) * 8); min-height: calc(var(--f) * 4);
    padding: calc(var(--hs) * 2) var(--f);
    pointer-events: auto; cursor: pointer;
    font: inherit; text-transform: uppercase; color: var(--ink);
    background: rgba(18, 14, 26, .72); border: var(--hs) solid rgba(247, 219, 176, .55);
    text-shadow: var(--hs) var(--hs) 0 #120e1a;
  }
  #pausebtn .pause-label { line-height: 1; }
  body.touch #pausebtn { display: flex; }
  body.touch.menu #pausebtn,
  body.menu #pausebtn { display: none; }
  body.touch.vert #pausebtn { top: calc(var(--f) * 12); }
  #crossbtn { position: absolute; right: var(--f); bottom: calc(var(--f) * 5); pointer-events: none; display: none; text-align: center; font-size: var(--f); color: var(--amber); }
  #crossbtn .ring { position: relative; width: calc(var(--f) * 8); height: calc(var(--f) * 8); padding: var(--hs); }
  body.touch #crossbtn { display: block; }
  body.touch.menu #crossbtn { display: none; }
  #crossbtn.ready .ring { animation: flick .9s steps(2) infinite; }
  #crossbtn.spirit { color: var(--lav); }
  #crossbtn.press { animation: pressed .2s steps(2); }
  body.touch #bl { display: none; }
  body.touch #realm { right: auto; left: 50%; bottom: auto; top: var(--f); transform: translateX(-50%); }
  body.touch #score { bottom: var(--f); }
  body.touch #combo { top: calc(var(--f) * 13); }
  body.touch #note { top: calc(var(--f) * 11); }
  body.touch.vert #realm { top: calc(var(--f) * 8); }
  body.touch.vert #note { top: calc(var(--f) * 12); }
  body.vert #overlay h1 { font-size: calc(var(--f) * 2); }
  #tapfx { position: fixed; width: calc(var(--f) * 6); height: calc(var(--f) * 6); margin: calc(var(--f) * -3) 0 0 calc(var(--f) * -3); border: var(--hs) solid var(--amber); opacity: 0; pointer-events: none; }
  #tapfx.spirit { border-color: var(--lav); }
  #tapfx.go { animation: tapfx .35s steps(4) forwards; }
  @keyframes tapfx { 0% { opacity: 1; transform: scale(.5); } 100% { opacity: 0; transform: scale(1.5); } }
  /* keyframes stepped so motion stays on the pixel grid */
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes flick { 50% { opacity: .6; } }
  @keyframes pop { 0% { transform: translateX(-50%) scale(1); } 50% { transform: translateX(-50%) translateY(calc(var(--hs) * -2)); } 100% { transform: translateX(-50%); } }
  @keyframes rise { 0% { opacity: 0; margin-top: var(--hs); } 15% { opacity: 1; } 100% { opacity: 0; margin-top: calc(var(--f) * -4); } }
  @keyframes shake { 25% { transform: translateX(calc(var(--hs) * -2)); } 50% { transform: translateX(var(--hs)); } 75% { transform: translateX(calc(var(--hs) * -1)); } }
  @keyframes pressed { 50% { transform: scale(.9); } }
  .title-logo { margin: 0 auto var(--f); }
  /*__HUDCSS__*/
</style>
</head>
<body class="menu">
<div id="wrap">
  <canvas id="game" width="480" height="270"></canvas>
  <div class="hud">
    <div id="tl" class="px-panel ingame">
      <span class="spr-portrait"></span>
      <div id="hearts"></div>
    </div>
    <div id="tr" class="px-panel ingame"><div id="clock">9:00 PM</div><div id="phase">OPENING HOURS</div></div>
    <div id="score" class="ingame">000000</div>
    <div id="combo">CHAIN x2</div>
    <div id="bl" class="px-panel ingame">
      <div id="lanternbox"><span class="spr-icon_lantern"></span><div class="bar" id="barfill"></div><div class="key">SPACE CROSS</div></div>
    </div>
    <div id="realm" class="px-panel ingame"><span class="spr-tag_living"></span></div>
    <div id="note"></div>
    <button id="pausebtn" type="button" aria-label="Pause"><span class="spr-btn_pause"></span><span class="pause-label">PAUSE</span></button>
    <div id="crossbtn" class="ingame"><div class="ring px-panel"><span class="spr-icon_lantern"></span></div>TAP x2</div>
    <div id="overlay"></div>
    <div id="loading">LOADING</div>
  </div>
</div>
<div id="pops"></div>
<div id="stick"></div>
<div id="tapfx"></div>
<script>/*__BUNDLE__*/</script>
</body>
</html>
