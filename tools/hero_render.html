</head><body><script type="module">
// Hero renders for the Caretaker's Lantern (promo / icon source). Not used by the game.
// Materials are recognised by their base colour: amber glass, hot flame, lavender gem, wax, bronze trim, iron.
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { toCreasedNormals } from 'three/addons/utils/BufferGeometryUtils.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const P = new URLSearchParams(location.search);
const W = +(P.get('w') || 1024), H = +(P.get('h') || 1024);
const r = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
r.setPixelRatio(1); r.setSize(W, H); r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.0;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(26, W / H, 0.05, 50);

scene.add(new THREE.HemisphereLight(0x9c8acb, 0x2a1c30, 0.55));
const moon = new THREE.DirectionalLight(0xb9a8ff, 2.2); moon.position.set(-2.5, 3.2, -2.2); scene.add(moon);   // cool rim from behind-left
const fill = new THREE.DirectionalLight(0xffc89a, 0.6); fill.position.set(2.5, 1.2, 3.0); scene.add(fill);      // warm front fill
const flameLight = new THREE.PointLight(0xffa64d, 0.9, 2.2, 2.0); flameLight.position.set(0, 0.31, 0); scene.add(flameLight);

// materials by their palette colour (sRGB hex as exported)
function dress(root) {
  root.traverse(o => {
    if (!o.isMesh) return;
    const hex = o.material.color.getHexString(), g = o.geometry;
    o.geometry = toCreasedNormals(g, 0.55);                     // crisp flat faces, smooth curves
    let m;
    // glass tints the candlelight rather than catching it: unlit, translucent amber, with a thin bright edge from the bloom
    if (hex === 'ffb85b') m = new THREE.MeshBasicMaterial({ color: 0xff9a3c, transparent: true, opacity: 0.3, depthWrite: false, side: THREE.DoubleSide });
    else if (hex === 'ffe29a') m = new THREE.MeshBasicMaterial({ color: new THREE.Color(0xffc870).multiplyScalar(1.7) });
    else if (hex === 'ff9a3c') m = new THREE.MeshBasicMaterial({ color: new THREE.Color(0xff8a3a).multiplyScalar(1.5) });   // moon vents
    else if ((hex === 'efe0ff' || hex === 'b9a1e8')) m = new THREE.MeshStandardMaterial({ color: 0xb9a1e8, emissive: 0x9b7bff, emissiveIntensity: 1.1, roughness: 0.2 });
    else if (hex === 'f7dbb0' || hex === 'e8dcc0') m = new THREE.MeshStandardMaterial({ color: 0xf0dcc0, roughness: 0.75, emissive: 0x6a3a10, emissiveIntensity: 0.25 });
    else if (hex === '9a6b3c') m = new THREE.MeshStandardMaterial({ color: 0xb07a40, roughness: 0.38, metalness: 0.85 });
    else if (hex === '3e3648') m = new THREE.MeshStandardMaterial({ color: 0x3a3248, roughness: 0.55, metalness: 0.55 });
    else m = new THREE.MeshStandardMaterial({ color: 0x120e18, roughness: 0.9 });
    o.material = m;
    if (m.transparent) o.renderOrder = 2;
  });

}

let model, composer, bloom;
window.__load = async () => {
  const g = await new GLTFLoader().loadAsync('/assets/hero/lantern_hero.glb');
  model = dress(g.scene); scene.add(model);
  composer = new EffectComposer(r);
  composer.addPass(new RenderPass(scene, cam));
  bloom = new UnrealBloomPass(new THREE.Vector2(W, H), 0.38, 0.35, 0.92); composer.addPass(bloom);
  composer.addPass(new OutputPass());
  return true;
};
// shot: yaw (radians), pitch, distance, look-at height, background ('none' for transparent), bloom on/off, flicker phase
window.__shot = ({ yaw = 0.6, pitch = 0.18, dist = 3.2, look = 0.47, bg = 'none', glow = true, t = 0 } = {}) => {
  model.rotation.y = yaw;
  cam.position.set(0, look + Math.sin(pitch) * dist, Math.cos(pitch) * dist); cam.lookAt(0, look, 0);
  flameLight.intensity = 0.9 * (0.92 + 0.08 * Math.sin(t * 11) * Math.sin(t * 7.1));
  if (bg === 'none') { scene.background = null; r.setClearColor(0x000000, 0); }
  else scene.background = new THREE.Color(bg);
  if (glow && bg !== 'none') composer.render(); else r.render(scene, cam);
  return true;
};
// icon mode: at a dozen pixels the glass must read as lit amber, so make it near-opaque and lift the iron a touch
window.__iconMode = () => {
  model.traverse(o => {
    if (!o.isMesh) return;
    const m = o.material;
    if (m.transparent && m.isMeshBasicMaterial) { m.color.set(0xffb85b); m.opacity = 0.92; }
    if (m.isMeshStandardMaterial && m.metalness > 0.5 && m.color.getHex() === 0x3a3248) m.color.set(0x5a4f6c);
  });
  fill.intensity = 1.4; moon.intensity = 2.6;
  return true;
};
window.__ready = true;
