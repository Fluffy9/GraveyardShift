import * as THREE from 'three';

import { buildWarden } from 'warden';
import { SPIRITS } from 'spirits';

const CELL = Number(new URLSearchParams(location.search).get("cell") || 112), SCALE = 3;

    const model = n.startsWith('@') ? g.scene : toonify(g.scene);
